model:
  path: models/stable-diffusion-xl-base-1.0
  device: auto
  dtype: auto
  allow_download: false
data:
  caption_cache: data/coco_train2014_multi_noun.jsonl
  num_workers: 4
maskattn:
  stage: mid
  placement: encoder_decoder
  threshold: 0.5
  negative_value: -10000.0
  gate_hidden_dim: 128
  share_gate_heads_by_stage: true
train:
  resolution: 512
  max_train_steps: 100000
  train_batch_size: 2
  gradient_accumulation_steps: 8  # effective batch size 16 on one process
  learning_rate: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  lr_warmup_steps: 1000
  mixed_precision: fp16
  max_grad_norm: 1.0
  seed: 42
  checkpointing_steps: 1000
  log_every: 20
  validation_every: 1000
  validation_prompts:
    - A red dragon on the left and a blue dragon on the right, cinematic shot
  resume_from: null
output_dir: outputs/train_512
