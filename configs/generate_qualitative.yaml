model:
  path: models/stable-diffusion-xl-base-1.0
  device: auto
  dtype: auto
  allow_download: false
method: maskattn
# Required for method: maskattn. The loader rejects random gates for qualitative generation.
checkpoint: null
maskattn:
  stage: mid
  placement: encoder_decoder
  threshold: 0.5
  negative_value: -10000.0
  gate_hidden_dim: 128
# Set true only to require this declared wiring to match checkpoint metadata.
maskattn_override: false
prompts: configs/prompts_qualitative.jsonl
output_dir: outputs/qualitative
seed: 2026
height: 1024
width: 1024
num_inference_steps: 30
guidance_scale: 7.5
negative_prompt: null
save_masks: true
comparison:
  enabled: true
  baseline_method: sdxl
  # Set this only when the baseline uses a different local Diffusers model.
  baseline_model_path: null
  # Or reuse an existing folder containing one baseline PNG per prompt.
  baseline_images_dir: null
