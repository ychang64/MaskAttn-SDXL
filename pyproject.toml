[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maskattn-sdxl"
version = "0.1.0"
description = "Reproducible implementation of MaskAttn-SDXL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.4,<2.6",
  "diffusers==0.35.1",
  "transformers>=4.46,<4.50",
  "accelerate>=0.30,<1.2",
  "datasets>=2.18",
  "safetensors>=0.4,<0.6",
  "huggingface-hub>=0.34,<1.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "numpy>=1.24,<2.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
metrics = ["torchmetrics[image]>=1.4", "open-clip-torch>=2.26", "clean-fid>=0.1.35", "scikit-learn>=1.3"]
data = ["spacy>=3.7,<4"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
